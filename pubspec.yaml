name: mental_health
description: Mental Health & Well-being App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # UI & Fonts
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # HTTP
  http: ^1.2.0
  dio: ^5.4.0

  # Secure env config
  flutter_dotenv: ^5.1.0

  # Charts
  fl_chart: ^0.67.0

  # Animations
  lottie: ^3.1.0
  animated_text_kit: ^4.2.2

  # ── Voice input (Speech to Text) ──
  speech_to_text: ^7.3.0

  # ── Voice output (Text to Speech) ──
  flutter_tts: ^4.0.2

  # Local notifications
  flutter_local_notifications: ^17.2.0

  # Other utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  permission_handler: ^12.0.1
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  flutter_launcher_icons: ^0.14.4
  external_path: ^2.2.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFEBA9" # Match the yellow background color from user image
  adaptive_icon_foreground: "assets/icon/app_icon.png"

